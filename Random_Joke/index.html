<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Joke Generator</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="index.css" />
    <link
      rel="shortcut icon"
      href="Assets/icons8-laughing-96.png"
      type="image/x-icon"
    />
    <script src="index.js" defer></script>
  </head>
  <body>
    <div class="container">
      <img
        src="./Assets/icons8-laughing-96.png"
        alt=""
        height="100px"
        width="100px"
      />
      <p class="joke" id="joke"></p>
      <div class="box">
        <button class="btn1" id="generate">Get Random Joke</button>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" value="" id="refresh" />
        <label class="form-check-label" for="checkDefault"> Auto-Load </label
        ><br />
        <select class="form-select form-select-sm disabled" aria-label="select example" id="selectbox" hidden>
          <option value="0" selected id="first">Manual</option>
          <option value="5000">5 Seconds</option>
          <option value="10000 ">10 Seconds</option>
          <option value="15000">15 Seconds</option>
        </select>
        <br>
      </div>
    </div>
  </body>
</html>
